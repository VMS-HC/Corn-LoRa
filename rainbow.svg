<svg fill="none" viewBox="0 0 800 100" width="800" height="100" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .rainbow-text {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          font-size: 40px;
          font-weight: 800;
          background: linear-gradient(
            to right, 
            #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff, #ff0000
          );
          background-size: 200% auto;
          color: transparent;
          -webkit-background-clip: text;
          background-clip: text;
          animation: shift-gradient 4s linear infinite;
          display: inline-block;
        }

        @keyframes shift-gradient {
          0% { background-position: 0% center; }
          100% { background-position: 200% center; }
        }
      </style>
      <div class="rainbow-text">Corn LoRa</div>
    </div>
  </foreignObject>
</svg>
